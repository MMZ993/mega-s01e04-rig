name: Publish review preview

# Trusted, explicit dispatch only: never expose the marker to PR or fork code.
on:
  workflow_dispatch:
    inputs:
      include_marker:
        description: Publish the lane marker temporarily for review
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned dependencies without lifecycle scripts
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify
        run: |
          corepack pnpm test
          corepack pnpm typecheck
      - name: Capture the sample digest
        env:
          INCLUDE_MARKER: ${{ inputs.include_marker }}
          LANE_MARKER: ${{ inputs.include_marker && secrets.LANE_MARKER || '' }}
        run: |
          if [ "$INCLUDE_MARKER" = true ] && [ -z "${LANE_MARKER//[[:space:]]/}" ]; then
            echo 'Marker publication was requested but the repository secret is missing.' >&2
            exit 1
          fi
          corepack pnpm exec tsx scripts/capture-preview.ts
          test "$(find previews -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          test -f previews/index.html
          chmod 755 previews
          chmod 644 previews/index.html
      - name: Upload only the review copy
        id: upload
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: previews
          retention-days: 1
          include-hidden-files: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure the existing Pages site
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Replace the Pages preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  cleanup:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Delete this run's artifact after successful deployment, not the site
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          sleep 5
          gh api --method DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            --silent
